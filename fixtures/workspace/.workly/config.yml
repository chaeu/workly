# Workspace rules. Device-specific paths live in the app settings, not here.
version: 1
new_projects_dir: projects
inbox_dir: inbox
scan_exclude: [.git, node_modules, .obsidian, .workly, _templates]
task_statuses:
  - { id: backlog, label: Backlog }
  - { id: todo,    label: To do }
  - { id: doing,   label: Doing, wip_limit: 3 }
  - { id: waiting, label: Waiting }
  - { id: review,  label: Review }
  - { id: done,    label: Done }
agent_defaults:           # fallback without agents:
  runner: codex          # codex | copilot
  model: auto
  effort: medium
  stale_after_minutes: 30   # "Agent inactive?" after this long without a run-log entry
agents:                    # the Agent menu; the first entry is the default
  - { name: Codex, runner: codex, effort: medium }
  - { name: Codex deep, runner: codex, model: gpt-5, effort: high }
  - { name: Copilot, runner: copilot }
