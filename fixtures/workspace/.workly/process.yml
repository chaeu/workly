# Use-case process. Data, not code: editable without a rebuild.
# Fixture version with neutral English labels.

lanes:
  - { id: fb,  label: Business,              sub: "Need, test, acceptance" }
  - { id: me,  label: Me / Automation,       sub: "Pilot, concept, build" }
  - { id: gov, label: Boards & Governance,   sub: "Demand board, privacy, security, AI" }
  - { id: it,  label: IT & Operations,       sub: "Access, go-live, operations" }

phases:
  - { id: idea,    name: Idea,       desc: Need reported }
  - { id: pilot,   name: Pilot,      desc: "Quick feasibility, timeboxed" }
  - { id: demand,  name: Demand,     desc: "Only if needed: request and board", optional: true }
  - { id: concept, name: Concept,    desc: "Design, data, approvals" }
  - { id: build,   name: Build,      desc: "Access, build MVP" }
  - { id: test,    name: Test,       desc: UAT with the business }
  - { id: live,    name: Live,       desc: "Rollout, hypercare" }
  - { id: run,     name: Operations, desc: "Monitoring, measure value" }
  - { id: parked,  name: Parked,     desc: "No-go, dropped or later", parked: true }

# kind: box | gate | term (term is never a valid use-case position)
# col 4 stays empty: room for the "No" branch from G0 up to Parked.
steps:
  - { id: start,   kind: term, col: 0,  lane: fb,  label: Start }
  - { id: need,    kind: box,  col: 1,  lane: fb,  phase: idea,    label: Capture,          sub: "Problem, volume" }
  - { id: assess,  kind: box,  col: 2,  lane: me,  phase: idea,    label: Assess,           sub: Score value & feasibility }
  - { id: g0,      kind: gate, col: 3,  lane: me,  phase: idea,    code: G0, label: "Pilot?", hint: "Value and feasibility worth a timeboxed pilot" }
  - { id: pilot,   kind: box,  col: 5,  lane: me,  phase: pilot,   label: Pilot / quick PoC, sub: "Feasible? 2-4 weeks" }
  - { id: g1,      kind: gate, col: 6,  lane: me,  phase: pilot,   code: G1, label: "Pursue?", hint: "Pilot shows feasibility and value. Re-assess with pilot results" }
  - { id: parked,  kind: box,  col: 6,  lane: fb,  phase: parked,  label: Parked,           sub: No-go or later, parked: true }
  - { id: wd,      kind: gate, col: 7,  lane: me,  phase: demand,  code: Switch, label: "Demand needed?", hint: "Yes for budget, other teams or core systems; no for self-build" }
  - { id: demand,  kind: box,  col: 8,  lane: gov, phase: demand,  label: Demand,           sub: "Request, business case", optional: true }
  - { id: g2,      kind: gate, col: 9,  lane: gov, phase: demand,  code: G2, label: "Demand ok?", hint: "Board releases budget or capacity", optional: true }
  - { id: concept, kind: box,  col: 10, lane: me,  phase: concept, label: Concept,          sub: "Design, data, operations" }
  - { id: g3,      kind: gate, col: 11, lane: gov, phase: concept, code: G3, label: "Approvals ok?", hint: "Privacy, IT security, AI governance for AI" }
  - { id: infra,   kind: box,  col: 12, lane: it,  phase: build,   label: Access & infra,   sub: "Permissions, environments" }
  - { id: build,   kind: box,  col: 13, lane: me,  phase: build,   label: Build,            sub: "MVP, production-ready" }
  - { id: uat,     kind: box,  col: 14, lane: fb,  phase: test,    label: Test (UAT),       sub: with real cases }
  - { id: g4,      kind: gate, col: 15, lane: fb,  phase: test,    code: G4, label: "Accepted?", hint: "Business accepts, handover to operations" }
  - { id: live,    kind: box,  col: 16, lane: it,  phase: live,    label: Go-live,          sub: "Rollout, hypercare" }
  - { id: run,     kind: box,  col: 17, lane: it,  phase: run,     label: Operations,       sub: "Monitoring, value" }
  - { id: end,     kind: term, col: 18, lane: it,  label: End }

phase_default_step:
  idea: need
  pilot: pilot
  demand: wd
  concept: concept
  build: build
  test: uat
  live: live
  run: run
  parked: parked

board_gates:
  idea: g0
  pilot: g1
  demand: g2
  concept: g3
  test: g4

# route: h | hv | hvh | vu | over. Label starting with "No" = negative branch.
edges:
  - { from: start,   to: need,    route: h }
  - { from: need,    to: assess,  route: hv }
  - { from: assess,  to: g0,      route: h }
  - { from: g0,      to: pilot,   route: h,    label: "Yes", label_dx: 16 }
  - { from: g0,      to: parked,  route: hvh,  label: "No" }
  - { from: pilot,   to: g1,      route: h }
  - { from: g1,      to: parked,  route: vu,   label: "No" }
  - { from: g1,      to: wd,      route: h,    label: "Yes" }
  - { from: wd,      to: concept, route: h,    label: "No, self-build", label_dx: 22 }
  - { from: wd,      to: demand,  route: hvh,  label: "Yes" }
  - { from: demand,  to: g2,      route: h }
  - { from: g2,      to: demand,  route: over, label: "No, rework" }
  - { from: g2,      to: concept, route: hv,   label: "Yes", offset: -22 }
  - { from: concept, to: g3,      route: hv }
  - { from: g3,      to: concept, route: hv,   label: "No", offset: 22 }
  - { from: g3,      to: infra,   route: hv,   label: "Yes" }
  - { from: infra,   to: build,   route: hv }
  - { from: build,   to: uat,     route: hv }
  - { from: uat,     to: g4,      route: h }
  - { from: g4,      to: build,   route: over, label: "No, rework" }
  - { from: g4,      to: live,    route: hv,   label: "Yes" }
  - { from: live,    to: run,     route: h }
  - { from: run,     to: end,     route: h }

statuses:
  - { id: active,  label: Active }
  - { id: waiting, label: Waiting }
  - { id: blocked, label: Blocked }
  - { id: on_hold, label: On hold }
  - { id: stable,  label: Stable }

types:
  - { id: ai,     label: AI }
  - { id: hybrid, label: Hybrid }
  - { id: rule,   label: Rule-based }

# Suggestions only: areas are free text, a new one is just typed in the app.
areas: [Finance, Customer Service, Sales, Operations, Data & Reporting]

stale_after_days: 21

# Use-case assessment before G0 and again at G1.
# Criteria: 1-3 points, anchors = what 1, 2 and 3 mean. With `fte: [low, high]` the points come from
# Manual effort as soon as the use case has entries: 1 + 2 * (FTE - low) / (high - low), kept within 1-3.
# Bonus criteria (`bonus: true`, value axis, one anchor): yes counts as 3, no is left out and never open.
# compliance: if GDPR and the EU AI Act come out differently, the worse one counts.
# K.O. questions (pass | fail | open) can be added back as `ko:` with id and label, e.g.
#   ko:
#     - { id: owner, label: Business owner named }
assessment:
  criteria:
    - id: volume
      axis: value
      label: Time saved
      fte: [0.5, 2]
      anchors: ["≤ 0.5 FTE", "0.5–2 FTE", "≥ 2 FTE"]
    - id: quality
      axis: value
      label: Quality / risk reduction
      anchors: ["Little effect on errors or lead time", "Noticeably fewer errors or faster", "Removes a known error source or compliance risk"]
    - id: customer
      axis: value
      label: Customer & downstream benefit
      bonus: true
      anchors: ["Noticeable outside the team beyond the FTE: faster answers, fewer follow-up questions or complaints"]
    - id: money
      axis: value
      label: Financial impact
      bonus: true
      anchors: ["Earns or saves money beyond the FTE, e.g. premiums not charged today"]
    - id: reuse
      axis: value
      label: Reuse
      bonus: true
      anchors: ["The solution or its pattern can be reused by other teams or units, e.g. other lines of business"]
    - id: access
      axis: feasibility
      label: Data access
      anchors: ["Only a sample or no access; depends on another department or a licence", "Access by request in sight, or partial", "I have full access now"]
    - id: integration
      axis: feasibility
      label: Integration
      anchors: ["Must be built into core systems, or another team has to change something", "Reads or writes through existing interfaces (API, export)", "Stands alone: own endpoint, touches no other system"]
    - id: maturity
      axis: feasibility
      label: Process maturity
      anchors: ["Ad hoc, everyone does it differently", "Mostly stable, rules partly implicit", "Stable, documented, clear rules"]
    - id: compliance
      axis: feasibility
      label: Compliance (GDPR, EU AI Act)
      anchors: ["Sensitive data (e.g. health) or the AI decides about individuals", "Personal data within existing rules, or the AI talks to customers", "No personal data, no decisions about individuals"]
